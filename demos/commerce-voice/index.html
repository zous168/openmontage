<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Commerce Voice — 切片重组 + 六层辅效</title>
  <style>
    body { margin: 0; background: #000; }
    * { box-sizing: border-box; }
    [data-composition-id="root"] {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0A0A12;
      font-family: "system-ui", -apple-system, "Segoe UI", sans-serif;
      color: #FFFFFF;
    }
    .bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    /* 常驻可读性遮罩 */
    #shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(5,5,10,0.5) 0%, rgba(5,5,10,0.16) 20%,
        rgba(5,5,10,0.16) 60%, rgba(5,5,10,0.7) 100%);
    }
    #brandbar {
      position: absolute; top: 70px; left: 0; width: 100%;
      display: flex; justify-content: center;
      font-size: 34px; font-weight: 700; letter-spacing: 0.5em; margin-right: -0.5em;
      color: rgba(255,255,255,0.85);
    }
    /* ---- 字幕 ---- */
    .caption {
      position: absolute; left: 60px; right: 60px; bottom: 240px;
      font-size: 70px; font-weight: 800; line-height: 1.35;
      text-align: center;
      text-shadow: 0 4px 24px rgba(0,0,0,0.85), 0 2px 4px rgba(0,0,0,0.7);
      will-change: transform, opacity;
    }
    .caption .hl { color: #F5C470; }
    /* ---- 核心卡 ---- */
    .focus-card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 26px; text-align: center;
    }
    .focus-card .card-shade {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 90% 55% at 50% 50%, rgba(5,5,10,0.82) 0%, rgba(5,5,10,0.4) 70%, transparent 100%);
    }
    .focus-card .line1 { position: relative; font-size: 92px; font-weight: 900; line-height: 1.25; }
    .focus-card .line1 .hl { color: #F5C470; text-shadow: 0 0 70px rgba(245,196,112,0.5); }
    .focus-card .line2 { position: relative; font-size: 44px; font-weight: 600; color: #B9B9CC; letter-spacing: 0.2em; margin-right: -0.2em; }
    /* ---- 结尾对比卡 ---- */
    .end-card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 48px;
    }
    .end-card .vs-shade {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 100% 70% at 50% 50%, rgba(5,5,10,0.9) 0%, rgba(5,5,10,0.55) 75%, transparent 100%);
    }
    .end-row { position: relative; display: flex; align-items: center; gap: 24px; font-size: 60px; font-weight: 800; }
    .end-row .tag { font-size: 32px; font-weight: 700; padding: 10px 26px; border-radius: 999px; }
    .end-row.good .tag { background: #F5C470; color: #0A0A12; }
    .end-row.bad .tag { background: #3A3A4A; color: #9B9BAB; }
    .end-row.good { color: #F5C470; }
    .end-row.bad { color: #8B8B9B; }
    /* ---- 画中画卡片 ---- */
    .pip {
      position: absolute; border-radius: 26px;
      background: rgba(10,10,18,0.88);
      border: 2px solid rgba(245,196,112,0.45);
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      padding: 34px 40px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .pip .pip-title { font-size: 42px; font-weight: 800; color: #F5C470; }
    .pip .pip-sub { font-size: 30px; font-weight: 500; color: #A9A9BC; }
    .pip .bars { display: flex; flex-direction: column; gap: 14px; }
    .pip .bar { height: 16px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden; }
    .pip .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F5C470, #FFE3A8); }
    .pip.ladder .bar i { background: linear-gradient(90deg, #22D3EE, #A78BFA); }
    .pip-l2 { position: absolute; right: 70px; top: 430px; width: 400px; }
    .pip-l3 { position: absolute; right: 70px; bottom: 560px; width: 420px; }
    /* ---- 贴纸 ---- */
    .sticker { position: absolute; font-weight: 900; text-align: center; will-change: transform, opacity; }
    #st1 { left: 130px; top: 620px; font-size: 240px; color: #FFE066; text-shadow: 0 0 90px rgba(255,224,102,0.6); transform: rotate(-12deg); }
    #st2 {
      left: 170px; bottom: 480px; width: 260px; height: 260px; border-radius: 50%;
      border: 10px solid #22D3EE;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; font-weight: 800; color: #22D3EE;
      text-shadow: 0 0 40px rgba(34,211,238,0.5);
    }
    #st3 { right: 130px; bottom: 520px; font-size: 220px; color: #FF5C5C; text-shadow: 0 0 80px rgba(255,92,92,0.6); transform: rotate(8deg); }
    /* ---- 特效:扫光 / 光晕 ---- */
    #shine {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.22) 50%, transparent 60%);
      background-size: 300% 100%;
      background-position: 130% 0;
      pointer-events: none;
    }
    #halo {
      position: absolute; left: 50%; top: 42%;
      width: 760px; height: 760px; border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(245,196,112,0.3);
      box-shadow: 0 0 160px rgba(245,196,112,0.3), inset 0 0 160px rgba(245,196,112,0.15);
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- 切片重组:视频与音频同一批边界(词间隙),视频 -an 静音,声音全走独立 m4a 轨。
       时间线:S1 0 / S2 2.8 / S3 7.6 / S4 10.7 / S5 17.2 / S6 19.5(源 21.4 起,删冗余句) -->
  <div data-hf-id="hf-xmyn" data-composition-id="root" data-start="0" data-duration="25.5" data-width="1080" data-height="1920">
    <video data-hf-id="hf-ovr5" id="v1" class="bg-video" src="assets/clips/v1.mp4" data-start="0.0" data-duration="2.6" data-track-index="1" muted playsinline></video>
    <video data-hf-id="hf-v3hj" id="v2" class="bg-video" src="assets/clips/v2.mp4" data-start="2.8" data-duration="4.8" data-track-index="1" muted playsinline></video>
    <video data-hf-id="hf-y1wh" id="v3" class="bg-video" src="assets/clips/v3.mp4" data-start="7.6" data-duration="3.0" data-track-index="1" muted playsinline></video>
    <video data-hf-id="hf-0lzi" id="v4" class="bg-video" src="assets/clips/v4.mp4" data-start="10.7" data-duration="6.5" data-track-index="1" muted playsinline></video>
    <video data-hf-id="hf-f8b9" id="v5" class="bg-video" src="assets/clips/v5.mp4" data-start="17.2" data-duration="2.2" data-track-index="1" muted playsinline></video>
    <video data-hf-id="hf-cz4s" id="v6" class="bg-video" src="assets/clips/v6.mp4" data-start="19.5" data-duration="6.0" data-track-index="1" muted playsinline></video>

    <audio data-hf-id="hf-jijl" id="a1" data-start="0.0" data-duration="2.6" data-track-index="2" src="assets/clips/v1.m4a" data-volume="1"></audio>
    <audio data-hf-id="hf-yxyj" id="a2" data-start="2.8" data-duration="4.8" data-track-index="2" src="assets/clips/v2.m4a" data-volume="1"></audio>
    <audio data-hf-id="hf-hb85" id="a3" data-start="7.6" data-duration="3.0" data-track-index="2" src="assets/clips/v3.m4a" data-volume="1"></audio>
    <audio data-hf-id="hf-aa8w" id="a4" data-start="10.7" data-duration="6.5" data-track-index="2" src="assets/clips/v4.m4a" data-volume="1"></audio>
    <audio data-hf-id="hf-7zy3" id="a5" data-start="17.2" data-duration="2.2" data-track-index="2" src="assets/clips/v5.m4a" data-volume="1"></audio>
    <audio data-hf-id="hf-qh2q" id="a6" data-start="19.5" data-duration="6.0" data-track-index="2" src="assets/clips/v6.m4a" data-volume="1"></audio>

    <div data-hf-id="hf-pwjg" id="shade"></div>
    <div data-hf-id="hf-rzde" id="brandbar">主播进阶课 · 第 3 讲</div>

    <!-- 字幕(时间戳 = 转录词间隙) -->
    <div data-hf-id="hf-0rjt" id="cap1" class="caption clip" data-start="0.1" data-duration="2.4" data-track-index="3">拉开主播差距的,<br data-hf-id="hf-x5px">真是<span data-hf-id="hf-xx61" class="hl">话术</span>吗?</div>
    <div data-hf-id="hf-1nie" id="cap2" class="caption clip" data-start="2.9" data-duration="4.6" data-track-index="3">话术框架,只是<span data-hf-id="hf-cxtl" class="hl">最基础</span>的技能</div>
    <div data-hf-id="hf-7s31" id="cap3" class="caption clip" data-start="7.7" data-duration="2.8" data-track-index="3">真正拉开差距的,<br data-hf-id="hf-rsrt">是<span data-hf-id="hf-14ec" class="hl">穿透力</span>和<span data-hf-id="hf-9t7s" class="hl">感染力</span></div>
    <div data-hf-id="hf-ngti" id="cap4" class="caption clip" data-start="10.9" data-duration="2.9" data-track-index="3">非常重要的<span data-hf-id="hf-z1jo" class="hl">前提</span></div>
    <div data-hf-id="hf-h8d9" id="cap5" class="caption clip" data-start="13.9" data-duration="3.2" data-track-index="3">建立在对<span data-hf-id="hf-hypr" class="hl">自家话术绝对熟悉</span>之上</div>
    <div data-hf-id="hf-hq1f" id="cap6" class="caption clip" data-start="17.3" data-duration="1.9" data-track-index="3">首先,你得有自己的<span data-hf-id="hf-his1" class="hl">话术框架</span></div>

    <!-- 核心卡 S3 -->
    <div data-hf-id="hf-us30" id="focus1" class="focus-card clip" data-start="7.6" data-duration="3.0" data-track-index="4">
      <div data-hf-id="hf-jwm2" class="card-shade"></div>
      <div data-hf-id="hf-584z" class="line1">语言<span data-hf-id="hf-mgu4" class="hl">穿透力</span><br data-hf-id="hf-szow">×<br data-hf-id="hf-sldv">镜头<span data-hf-id="hf-gj6o" class="hl">感染力</span></div>
      <div data-hf-id="hf-ti7l" class="line2">拉开差距的关键</div>
      <div data-hf-id="hf-svny" id="shine"></div>
    </div>

    <!-- 结尾对比卡 S6 -->
    <div data-hf-id="hf-rqcr" id="endcard" class="end-card clip" data-start="19.6" data-duration="5.9" data-track-index="4">
      <div data-hf-id="hf-7by1" class="vs-shade"></div>
      <div data-hf-id="hf-tyg7" id="halo"></div>
      <div data-hf-id="hf-14rf" class="end-row good"><span data-hf-id="hf-6tr5" class="tag">脑里有话术</span><span data-hf-id="hf-p70p">→</span><span data-hf-id="hf-iscp">境界天花板</span></div>
      <div data-hf-id="hf-7bgd" class="end-row bad"><span data-hf-id="hf-ksdl" class="tag">脑里没话术</span><span data-hf-id="hf-v3ct">→</span><span data-hf-id="hf-icex">画蛇添足</span></div>
    </div>

    <!-- 画中画 -->
    <div data-hf-id="hf-0gvr" id="pip1" class="pip pip-l3 clip" data-start="3.0" data-duration="4.4" data-track-index="4">
      <div data-hf-id="hf-toti" class="pip-title">话术框架</div>
      <div data-hf-id="hf-ax72" class="pip-sub">基础技能 · 结构 · 套路</div>
      <div data-hf-id="hf-umx2" class="bars">
        <div data-hf-id="hf-ufsv" class="bar"><i data-hf-id="hf-tn5m" style="width:55%"></i></div>
        <div data-hf-id="hf-c51b" class="bar"><i data-hf-id="hf-kq1r" style="width:78%"></i></div>
        <div data-hf-id="hf-bqqa" class="bar"><i data-hf-id="hf-amuq" style="width:64%"></i></div>
      </div>
    </div>
    <div data-hf-id="hf-1fxa" id="pip2" class="pip pip-l2 ladder clip" data-start="11.0" data-duration="6.0" data-track-index="4">
      <div data-hf-id="hf-w0rb" class="pip-title">熟悉度阶梯</div>
      <div data-hf-id="hf-l5zi" class="pip-sub">穿透力与感染力的地基</div>
      <div data-hf-id="hf-rgy2" class="bars">
        <div data-hf-id="hf-bcf9" class="bar"><i data-hf-id="hf-m8f7" style="width:30%"></i></div>
        <div data-hf-id="hf-e4kg" class="bar"><i data-hf-id="hf-xbkb" style="width:52%"></i></div>
        <div data-hf-id="hf-dq9f" class="bar"><i data-hf-id="hf-yq0t" style="width:76%"></i></div>
        <div data-hf-id="hf-dbye" class="bar"><i data-hf-id="hf-3jld" style="width:100%"></i></div>
      </div>
    </div>

    <!-- 贴纸 -->
    <div data-hf-id="hf-x9hq" id="st1" class="sticker clip" data-start="0.3" data-duration="2.0" data-track-index="5">?</div>
    <div data-hf-id="hf-lr8m" id="st2" class="sticker clip" data-start="17.5" data-duration="1.7" data-track-index="5">框架</div>
    <div data-hf-id="hf-wyb8" id="st3" class="sticker clip" data-start="24.3" data-duration="1.1" data-track-index="5">✕</div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- 字幕跟读(全部窗口内动画)----
      const caps = [['#cap1', 0.1, 2.5], ['#cap2', 2.9, 7.5], ['#cap3', 7.7, 10.5], ['#cap4', 10.9, 13.8], ['#cap5', 13.9, 17.1], ['#cap6', 17.3, 19.2]];
      caps.forEach(([sel, s, e]) => {
        tl.fromTo(sel, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, s + 0.05);
        tl.to(sel, { opacity: 0, duration: 0.22, ease: 'power2.in' }, e - 0.25);
      });

      // ---- 核心卡:爆发 + 扫光 ----
      tl.fromTo('#focus1 .line1', { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.8)' }, 7.7);
      tl.fromTo('#focus1 .line2', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, 8.3);
      tl.fromTo('#shine', { backgroundPosition: '130% 0' }, { backgroundPosition: '-170% 0', duration: 1.3, ease: 'power2.inOut' }, 8.1);
      tl.to('#focus1 .line1 .hl', { scale: 1.12, duration: 0.4, yoyo: true, repeat: 1, ease: 'power2.out' }, 8.9);

      // ---- 结尾对比卡 ----
      tl.fromTo('#endcard .end-row.good', { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 19.7);
      tl.fromTo('#endcard .end-row.bad', { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 20.5);
      tl.fromTo('#halo', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: 'power2.out' }, 21.1);
      tl.to('#halo', { scale: 1.15, opacity: 0.55, duration: 0.8, ease: 'sine.inOut' }, 22.7);

      // ---- 画中画 ----
      tl.fromTo('#pip1', { scale: 0.7, y: 60, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' }, 3.05);
      tl.fromTo('#pip1 .bar i', { width: '0%' }, { width: (i) => ['55%', '78%', '64%'][i], duration: 0.6, stagger: 0.12, ease: 'power2.out' }, 3.5);
      tl.fromTo('#pip2', { scale: 0.7, y: -60, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.6)' }, 11.05);
      tl.fromTo('#pip2 .bar i', { width: '0%' }, { width: (i) => ['30%', '52%', '76%', '100%'][i], duration: 0.6, stagger: 0.14, ease: 'power2.out' }, 11.5);

      // ---- 贴纸 ----
      tl.fromTo('#st1', { scale: 0.2, opacity: 0, rotate: -40 }, { scale: 1, opacity: 1, rotate: -12, duration: 0.5, ease: 'elastic.out(1, 0.6)' }, 0.35);
      tl.fromTo('#st2', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.5)' }, 17.55);
      tl.to('#st2', { scale: 1.12, duration: 0.35, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 18.4);
      tl.fromTo('#st3', { scale: 0.2, opacity: 0, rotate: -20 }, { scale: 1, opacity: 1, rotate: 8, duration: 0.45, ease: 'elastic.out(1, 0.6)' }, 24.35);

      // ---- 片段切换:尾淡出 → 黑场(词间隙)→ 首淡入,全部窗口内,不跨 data-start ----
      tl.to('#v1', { duration: 0.2, ease: "none", opacity: 1 }, 2.4);
      tl.fromTo('#v2', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 2.8);
      tl.to('#v2', { opacity: 0, duration: 0.2, ease: 'power1.in' }, 7.4);
      tl.set('#v2', { opacity: 0 }, 7.6);
      tl.fromTo('#v3', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 7.6);
      tl.to('#v3', { opacity: 0, duration: 0.2, ease: 'power1.in' }, 10.4);
      tl.fromTo('#v4', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 10.7);
      tl.to('#v4', { opacity: 0, duration: 0.2, ease: 'power1.in' }, 17.0);
      tl.fromTo('#v5', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 17.2);
      tl.to('#v5', { opacity: 0, duration: 0.2, ease: 'power1.in' }, 19.2);
      tl.fromTo('#v6', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.out' }, 19.5);

      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
