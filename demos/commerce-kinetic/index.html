<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Commerce Kinetic — 15s 带货动效排版小样</title>
  <style>
    body { margin: 0; background: #07070D; }
    * { box-sizing: border-box; }
    [data-composition-id="root"] {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(ellipse 120% 80% at 50% -10%, #1A1420 0%, #0A0A12 55%, #050508 100%);
      font-family: "system-ui", -apple-system, "Segoe UI", sans-serif;
      color: #F5F3EA;
    }
    .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    /* ---- 品牌名逐字 ---- */
    #brand { display: flex; justify-content: center; align-items: center; height: 100%; }
    #brand .char {
      display: inline-block;
      font-size: 150px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #F5F3EA;
      text-shadow: 0 0 60px rgba(245, 195, 112, 0.35);
      will-change: transform, opacity;
    }
    #brand .char.dim { color: #F5C470; }
    /* ---- 价格区 ---- */
    /* 可见性由 .clip 时间窗管理,不用 CSS opacity 隐藏(否则 GSAP 只动画子元素时整层永远不可见) */
    #price { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
    #price .price-label { font-size: 44px; font-weight: 500; color: #9B9BAB; letter-spacing: 0.5em; margin-right: -0.5em; }
    #price .price-num {
      position: relative;
      font-size: 210px;
      font-weight: 900;
      color: #F5C470;
      line-height: 1;
      text-shadow: 0 0 90px rgba(245, 197, 112, 0.5);
    }
    #price .price-num .shine {
      position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.85) 50%, transparent 65%);
      background-size: 250% 100%;
      background-position: 250% 0;
      mix-blend-mode: overlay;
    }
    #price .old-price { font-size: 40px; color: #6E6E7E; text-decoration: line-through; text-decoration-color: #FF5C5C; }
    /* ---- 卖点 ---- */
    #features { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 64px; }
    #features .feat { display: flex; align-items: baseline; gap: 28px; }
    #features .feat .num { font-size: 120px; font-weight: 900; color: #22D3EE; }
    #features .feat .unit { font-size: 60px; font-weight: 700; color: #22D3EE; }
    #features .feat .desc { font-size: 56px; font-weight: 600; color: #F5F3EA; }
    #features .feat:nth-child(2) .num, #features .feat:nth-child(2) .unit { color: #A78BFA; }
    #features .feat:nth-child(3) .num, #features .feat:nth-child(3) .unit { color: #34D399; }
    /* ---- 销量 ---- */
    #sales { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; }
    #sales .sales-num { font-size: 200px; font-weight: 900; color: #F5F3EA; line-height: 1; }
    #sales .sales-num .plus { color: #F5C470; }
    #sales .sales-cap { font-size: 44px; color: #9B9BAB; letter-spacing: 0.4em; margin-right: -0.4em; }
    #sales .halo {
      position: absolute; left: 50%; top: 50%;
      width: 700px; height: 700px; border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(245, 196, 112, 0.25);
      box-shadow: 0 0 140px rgba(245, 196, 112, 0.22), inset 0 0 140px rgba(245, 196, 112, 0.12);
    }
    /* ---- 商品图 ---- */
    #product { display: flex; justify-content: center; align-items: center; }
    #product .frame {
      width: 620px; height: 840px;
      border-radius: 36px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.14);
      box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 90px rgba(245, 196, 112, 0.16);
    }
    #product img { width: 100%; height: 100%; object-fit: cover; }
    #product .tag {
      position: absolute; left: 50%; bottom: 220px;
      transform: translateX(-50%);
      font-size: 44px; font-weight: 700; color: #07070D;
      background: #F5C470;
      padding: 16px 48px; border-radius: 999px;
      box-shadow: 0 12px 40px rgba(245, 196, 112, 0.45);
    }
    /* ---- CTA ---- */
    #cta { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
    #cta .big { font-size: 170px; font-weight: 900; color: #FF5C5C; line-height: 1; text-shadow: 0 0 100px rgba(255, 92, 92, 0.45); }
    #cta .small { font-size: 60px; font-weight: 700; color: #F5F3EA; letter-spacing: 0.2em; margin-right: -0.2em; }
    #cta .badge {
      font-size: 40px; font-weight: 700; color: #F5C470;
      border: 2px solid rgba(245, 196, 112, 0.6);
      padding: 18px 56px; border-radius: 999px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="root" data-start="0" data-duration="15" data-width="1080" data-height="1920">
    <!-- 1. 品牌名逐字 -->
    <div id="brand" class="layer clip" data-start="0" data-duration="1.6" data-track-index="1">
      <div class="split-me" data-split="chars">AIRNOTHING</div>
    </div>

    <!-- 2. 价格 -->
    <div id="price" class="layer clip" data-start="1.6" data-duration="2.2" data-track-index="1">
      <div class="price-label">首发价</div>
      <div class="price-num"><span class="price-val">¥0</span><span class="shine"></span></div>
      <div class="old-price">¥599</div>
    </div>

    <!-- 3. 卖点三连 -->
    <div id="features" class="layer clip" data-start="3.8" data-duration="3.0" data-track-index="1">
      <div class="feat"><span class="num">12</span><span class="unit">g</span><span class="desc">超轻机身</span></div>
      <div class="feat"><span class="num">30</span><span class="unit">天</span><span class="desc">长续航</span></div>
      <div class="feat"><span class="num">IP68</span><span class="desc">防水</span></div>
    </div>

    <!-- 4. 销量 -->
    <div id="sales" class="layer clip" data-start="6.8" data-duration="2.6" data-track-index="1">
      <div class="halo"></div>
      <div class="sales-num"><span class="sales-val">0</span><span class="plus">W+</span></div>
      <div class="sales-cap">销量见证</div>
    </div>

    <!-- 5. 商品图 -->
    <div id="product" class="layer clip" data-start="9.4" data-duration="3.0" data-track-index="1">
      <div class="frame"><img src="assets/product.jpg" alt=""></div>
      <div class="tag">全渠道现货</div>
    </div>

    <!-- 6. CTA -->
    <div id="cta" class="layer clip" data-start="12.4" data-duration="2.6" data-track-index="1">
      <div class="big">5 折</div>
      <div class="small">今晚截止</div>
      <div class="badge">点击下单</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- 品牌名:手写 SplitText(逐字)----
      const brandChars = document.querySelectorAll('#brand .split-me[data-split="chars"]');
      brandChars.forEach((el) => {
        const text = el.textContent;
        const chars = text.split('');
        el.innerHTML = '';
        chars.forEach((c, i) => {
          const span = document.createElement('span');
          span.className = 'char' + (c === 'N' ? ' dim' : '');
          span.textContent = c;
          el.appendChild(span);
        });
        gsap.set(el.querySelectorAll('.char'), { y: 80, opacity: 0, rotate: 8, transformOrigin: '50% 100%' });
        tl.to(el.querySelectorAll('.char'), {
          y: 0, opacity: 1, rotate: 0,
          duration: 0.5,
          stagger: 0.07,
          ease: 'back.out(2.2)',
        }, 0.15);
      });

      // ---- 价格:数字滚动 + 金色扫光 ----
      tl.fromTo('#price .price-val',
        { textContent: 0 },
        {
          textContent: 299,
          duration: 0.9,
          ease: 'power2.out',
          onUpdate: function () {
            this.targets()[0].textContent = '¥' + Math.round(this.targets()[0].textContent);
          },
        }, 1.7);
      tl.to('#price .shine', {
        backgroundPosition: '-150% 0',
        duration: 1.1,
        ease: 'power2.inOut',
      }, 1.9);

      // ---- 卖点三连:依次 slide-up 爆发 ----
      tl.fromTo('#features', { opacity: 1 }, { opacity: 1, duration: 0.01 }, 3.8);
      tl.fromTo('#features .feat',
        { y: 140, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, stagger: 0.18, ease: 'back.out(1.7)' },
        3.9);
      tl.to('#features .feat:nth-child(1) .num', { scale: 1.25, duration: 0.3, yoyo: true, repeat: 1, ease: 'power2.out' }, 4.5);
      tl.to('#features .feat:nth-child(3) .num', { scale: 1.18, duration: 0.3, yoyo: true, repeat: 1, ease: 'power2.out' }, 5.4);

      // ---- 销量:数字计数 + 光环脉冲 ----
      tl.fromTo('#sales .sales-val',
        { textContent: 0 },
        {
          textContent: 100,
          duration: 1.1,
          ease: 'power1.out',
          onUpdate: function () {
            this.targets()[0].textContent = Math.round(this.targets()[0].textContent);
          },
        }, 6.9);
      tl.fromTo('#sales .halo', { scale: 0.7, opacity: 0 }, { scale: 1.25, opacity: 1, duration: 1.0, ease: 'power2.out' }, 6.9);
      tl.to('#sales .halo', { scale: 1.35, opacity: 0.55, duration: 0.7, ease: 'sine.inOut' }, 8.1);

      // ---- 商品图:旋转弹入 + 标签 ----
      tl.fromTo('#product .frame',
        { y: 160, rotate: -8, opacity: 0, scale: 0.8 },
        { y: 0, rotate: 0, opacity: 1, scale: 1, duration: 0.7, ease: 'back.out(1.4)' },
        9.5);
      tl.fromTo('#product .tag',
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' },
        10.3);

      // ---- CTA:大字 pulse + 徽章 ----
      tl.fromTo('#cta .big', { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'elastic.out(1, 0.55)' }, 12.5);
      tl.to('#cta .big', { scale: 1.08, duration: 0.5, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 13.3);
      tl.fromTo('#cta .small', { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 12.9);
      tl.fromTo('#cta .badge', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }, 13.2);
      tl.to('#cta .badge', { boxShadow: '0 0 60px rgba(245, 196, 112, 0.9)', duration: 0.4, yoyo: true, repeat: 2, ease: 'sine.inOut' }, 13.4);

      // ---- 层间切换:上一幕淡出 + clip 边界 hard kill(非线形 seek 安全)----
      tl.to('#brand', { opacity: 0, duration: 0.35 }, 1.45);
      tl.set('#brand', { opacity: 0 }, 1.6);
      tl.to('#price', { opacity: 0, duration: 0.3 }, 3.6);
      tl.set('#price', { opacity: 0 }, 3.8);
      tl.to('#features', { opacity: 0, duration: 0.3 }, 6.55);
      tl.set('#features', { opacity: 0 }, 6.8);
      tl.to('#sales', { opacity: 0, duration: 0.3 }, 9.15);
      tl.set('#sales', { opacity: 0 }, 9.4);
      tl.to('#product', { opacity: 0, duration: 0.3 }, 12.15);
      tl.set('#product', { opacity: 0 }, 12.4);

      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
