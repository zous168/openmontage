[pytest]
# 单仓库、单环境、两套测试：
#   agent-hub/src/plugins/openmontage/tests  —— OpenMontage 能力层
#   agent-hub/tests                          —— Hermes 内核
#
# 源码搬进插件后顶层包重名已消除（OpenMontage 的包现在是
# plugins.openmontage.*），两套测试可以在同一次调用里跑完。
testpaths =
    agent-hub/src/plugins/openmontage/tests
    agent-hub/tests

pythonpath =
    agent-hub/src
    agent-hub

# agent-hub 的异步用例不写 @pytest.mark.asyncio，沿用它原本的 auto 模式。
asyncio_mode = auto

norecursedirs =
    vendor
    remotion-composer
    node_modules
    .venv
    projects
    agent-hub/build
    agent-hub/dist

markers =
    slow: 真 LLM / 额度消耗大的测试，默认 pytest -m 'not slow' 跳过
